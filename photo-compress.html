<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Compress - Smart Digital Seva</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f6fc;
  text-align: center;
  padding: 20px;
}
.container {
  background: white;
  max-width: 450px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #ccc;
}
h1 { color: #0755a5; }
input, button {
  margin: 10px;
  padding: 10px;
}
input[type="number"] { width: 100px; }
button, .download {
  background: #0755a5;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 12px 20px;
  cursor: pointer;
}
.download {
  display: inline-block;
  text-decoration: none;
  margin-top: 12px;
}
#result { margin-top: 20px; }
img { max-width: 100%; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
<h1>Photo Compress Tool</h1>
<p>Photo ka target size KB mein set karein.</p>

<input type="file" id="photo" accept="image/*">

<p><b>Target Size (KB)</b></p>
<input type="number" id="targetKB" value="50" min="1" max="10000">

<p>Ya quick size select karein:</p>
<button onclick="setSize(20)">20 KB</button>
<button onclick="setSize(30)">30 KB</button>
<button onclick="setSize(50)">50 KB</button>
<button onclick="setSize(100)">100 KB</button>

<br>
<button id="compressBtn">Compress Photo</button>

<div id="result"></div>
</div>

<script>
function setSize(size) {
  document.getElementById("targetKB").value = size;
}

const photo = document.getElementById("photo");
const result = document.getElementById("result");

document.getElementById("compressBtn").addEventListener("click", function() {
  const file = photo.files[0];
  const target = Number(document.getElementById("targetKB").value);

  if (!file) {
    alert("Pehle photo select karein!");
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please image file select karein.");
    return;
  }

  if (!Number.isFinite(target) || target < 1 || target > 10000) {
    alert("Target size 1 se 10000 KB ke beech rakhein.");
    return;
  }

  result.innerHTML = "Photo compress ho rahi hai...";

  const url = URL.createObjectURL(file);
  const image = new Image();

  image.onload = function() {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    let width = image.naturalWidth;
    let height = image.naturalHeight;

    canvas.width = width;
    canvas.height = height;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(image, 0, 0, width, height);

    const targetBytes = target * 1024;
    let quality = 0.92;
    let bestBlob = null;
    let smallestBlob = null;
    let attempts = 0;

    function tryCompress() {
      canvas.toBlob(function(blob) {
        if (!blob) {
          result.innerHTML = "Photo compress nahi ho payi.";
          URL.revokeObjectURL(url);
          return;
        }

        attempts++;

        if (!smallestBlob || blob.size < smallestBlob.size) {
          smallestBlob = blob;
        }

        if (blob.size <= targetBytes) {
          bestBlob = blob;
        }

        if (blob.size <= targetBytes || attempts >= 12 || quality <= 0.1) {
          finish(bestBlob || smallestBlob, !!bestBlob);
          return;
        }

        if (quality > 0.15) {
          quality -= 0.08;
        } else {
          quality = 0.1;
        }

        if (attempts >= 7 && blob.size > targetBytes) {
          width = Math.max(1, Math.round(width * 0.8));
          height = Math.max(1, Math.round(height * 0.8));
          canvas.width = width;
          canvas.height = height;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(image, 0, 0, width, height);
        }

        tryCompress();
      }, "image/jpeg", quality);
    }

    function finish(blob, reachedTarget) {
      URL.revokeObjectURL(url);
      const downloadURL = URL.createObjectURL(blob);
      const originalSize = (file.size / 1024).toFixed(2);
      const newSize = (blob.size / 1024).toFixed(2);

      result.innerHTML = `
        <h3>${reachedTarget ? "Target size achieved!" : "Best possible compression"}</h3>
        <p>Original Size: ${originalSize} KB</p>
        <p>New Size: ${newSize} KB</p>
        <p>Target Size: ${target} KB</p>
        <p>${reachedTarget ? "Photo target ke andar hai." : "Is photo ko target KB tak compress nahi kiya ja saka. Yeh best result hai."}</p>
        <img src="${downloadURL}" alt="Compressed photo">
        <br>
        <a class="download" href="${downloadURL}" download="compressed-photo.jpg">
          Download Photo
        </a>
      `;
    }

    tryCompress();
  };

  image.onerror = function() {
    result.innerHTML = "Photo open nahi ho payi. Dusri image try karein.";
    URL.revokeObjectURL(url);
  };

  image.src = url;
});
</script>
</body>
